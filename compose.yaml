services:
  app:
    build:
      context: .
      args:
        VITE_SITE_NAME: ${VITE_SITE_NAME:-RuCorpus}
        VITE_SITE_SUBTITLE: ${VITE_SITE_SUBTITLE:-Parallel Corpus Search System}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - corpus_state:/state
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a fresh secret in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      DJANGO_BEHIND_HTTPS_PROXY: ${DJANGO_BEHIND_HTTPS_PROXY:-0}
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-0}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/session').read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  corpus_state:
